---
# Install llama-swap. Gated per host: `llama_swap_install` (host_vars).
#
# Gentoo: sci-misc/llama-swap from the `stuff` overlay (the ebuild builds
# from source — that is why installed binaries do not byte-match the
# GitHub release tarballs). The overlay itself is owned by two roles
# listed before this one in the playbook (both gated on
# stuff_overlay_managed): portage_overlay installs the shared tooling
# (git + app-eselect/eselect-repository) and stuff_overlay registers
# and syncs the overlay the Gentoo-blessed way via
# 'eselect repository add'. Portage here pulls the ebuild's build
# dependencies (dev-lang/go). state:present is a no-op while ANY
# version is installed, so enabling the gate on a box that already has
# llama-swap is safe; pin a version in llama_swap_pkg to force an
# upgrade.
#
# Non-Gentoo: pinned release tarball, if-missing ONLY (stat guard; an
# existing binary is never touched).

# The stuff-overlay ebuilds are arch-specific (KEYWORDS="~amd64 ..."),
# so a strict-accept_keywords box (fresh Gentoo) refuses them unless
# the arch is accepted per package — the same class of fix as the
# nftables USE unmask in system_base.
#
# /etc/portage/package.accept_keywords exists in two layouts, and the
# stat below picks the matching branch:
#  - directory of per-package files — the fresh-box default (m5ai01);
#    /etc/portage/package.accept_keywords/<category>/<package> with
#    traditional atom-line content ("<atom> ~amd64").
#  - single file — the desktop box, where the split dirs were
#    manually consolidated into single /etc/portage files on
#    2026-11-08 (kept that way on purpose; do not re-split).
- name: Gentoo — stat the accept_keywords path
  ansible.builtin.stat:
    path: /etc/portage/package.accept_keywords
  register: ls_ak_stat
  when:
    - (llama_swap_install | default(false)) | bool
    - ansible_facts.os_family == 'Gentoo'

# dir layout, or absent path (fresh box: create the dir layout).
- name: Gentoo — accept the arch keyword (per-package dir layout)
  ansible.builtin.copy:
    dest: "/etc/portage/package.accept_keywords/{{ (llama_swap_pkg | string).split('=')[0].split('::')[0].split('/')[0] }}/{{ (llama_swap_pkg | string).split('=')[0].split('::')[0].split('/')[1] }}"
    content: "{{ llama_swap_pkg }} ~amd64\n"
    owner: root
    group: root
    mode: "0644"
    directory_mode: "0755"
  become: true
  when:
    - (llama_swap_install | default(false)) | bool
    - ansible_facts.os_family == 'Gentoo'
    - (ls_ak_stat.stat.isdir | default(false))
      or not (ls_ak_stat.stat.exists | default(false))
  tags: [llama-swap-install]

- name: Gentoo — accept the arch keyword (legacy file layout)
  ansible.builtin.lineinfile:
    path: /etc/portage/package.accept_keywords
    line: "{{ llama_swap_pkg }} ~amd64"
    create: true
    mode: "0644"
  become: true
  when:
    - (llama_swap_install | default(false)) | bool
    - ansible_facts.os_family == 'Gentoo'
    - ls_ak_stat.stat.exists and not ls_ak_stat.stat.isdir
  tags: [llama-swap-install]

- name: Gentoo — ensure llama-swap is installed (portage)
  community.general.portage:
    package: "{{ llama_swap_pkg }}"
    state: present
    sync: yes
  become: true
  when:
    - (llama_swap_install | default(false)) | bool
    - ansible_facts.os_family == 'Gentoo'

# --- Non-Gentoo fallback: pinned release binary, if-missing ------------
- name: Stat target binary (non-Gentoo fallback)
  ansible.builtin.stat:
    path: "{{ llama_swap_bin | default('/usr/bin/llama-swap') }}"
  register: ls_bin_stat
  when:
    - (llama_swap_install | default(false)) | bool
    - ansible_facts.os_family != 'Gentoo'

- name: "Install llama-swap v{{ llama_swap_version }} (pinned release, non-Gentoo)"
  when:
    - (llama_swap_install | default(false)) | bool
    - ansible_facts.os_family != 'Gentoo'
    - not ls_bin_stat.stat.exists
  block:
    - name: Download pinned llama-swap release tarball
      ansible.builtin.get_url:
        url: "https://github.com/mostlygeek/llama-swap/releases/download/v{{ llama_swap_version }}/llama-swap_{{ llama_swap_version }}_linux_amd64.tar.gz"
        dest: "/tmp/llama-swap_{{ llama_swap_version }}_linux_amd64.tar.gz"
        mode: "0600"
        checksum: "sha256:{{ llama_swap_release_sha256 }}"
      tags: [llama-swap-install]

    - name: Extract into a staging dir
      ansible.builtin.unarchive:
        src: "/tmp/llama-swap_{{ llama_swap_version }}_linux_amd64.tar.gz"
        dest: "/tmp/llama-swap-install-{{ llama_swap_version }}"
        mode: "0755"
      tags: [llama-swap-install]

    - name: Install the binary
      ansible.builtin.copy:
        src: "/tmp/llama-swap-install-{{ llama_swap_version }}/llama-swap"
        dest: "{{ llama_swap_bin | default('/usr/bin/llama-swap') }}"
        remote_src: true
        owner: root
        group: root
        mode: "0755"
      become: true
      tags: [llama-swap-install]

    - name: Clean up staging files
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - "/tmp/llama-swap_{{ llama_swap_version }}_linux_amd64.tar.gz"
        - "/tmp/llama-swap-install-{{ llama_swap_version }}"

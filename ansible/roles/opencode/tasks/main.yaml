---
- name: Ensure opencode config directory exists
  file:
    path: "{{ ansible_user_dir }}/.config/opencode"
    state: directory
    mode: '0755'

- name: Deploy opencode files from repository
  copy:
    src: ../../../opencode/
    dest: "{{ ansible_user_dir }}/.config/opencode/"
    mode: '0644'

- name: Deploy opencode configuration from template
  template:
    src: opencode.jsonc.j2
    dest: "{{ ansible_user_dir }}/.config/opencode/opencode.jsonc"
    mode: '0644'

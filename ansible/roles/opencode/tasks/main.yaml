---
# Deployment gate: `opencode_managed` (host_vars; true only on the box
# that runs the opencode client — localhost. Other model boxes serve
# models, they don't host the client, so the default is false).
- name: Ensure opencode config directory exists
  file:
    path: "{{ ansible_user_dir }}/.config/opencode"
    state: directory
    mode: '0755'
  when: opencode_managed | default(false)
  tags:
    - config
    - opencode

- name: Assert provider key uniqueness for remote opencode endpoints
  ansible.builtin.assert:
    that:
      - ((vllm_endpoints | default([])) | map(attribute='provider') | unique | list | length)
        == ((vllm_endpoints | default([])) | map(attribute='provider') | list | length)
      - "'vllm' not in ((vllm_endpoints | default([])) | map(attribute='provider') | list)"
    fail_msg: >-
      vllm_endpoints provider keys must be unique and must not collide with
      the local 'vllm' provider (duplicate top-level JSON keys would
      silently merge or overwrite)
  when: opencode_managed | default(false)
  tags:
    - config
    - opencode

- name: Deploy opencode configuration from template
  template:
    src: opencode.jsonc.j2
    dest: "{{ ansible_user_dir }}/.config/opencode/opencode.jsonc"
    mode: '0644'
  when: opencode_managed | default(false)
  tags:
    - config
    - opencode

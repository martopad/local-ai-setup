# ---------------------------------------------------------------------------
# Shared model configuration for the llama-swap and opencode roles.
#
# max_model_len is the single source of truth for both generated files:
# llama-swap's --max-model-len and opencode's limit.context. They are
# now independent parameters in the opencode schema, and limit.context
# must equal the server's --max-model-len. Values are declared per model
# below (native context wherever the VRAM pool allows), not computed.
#
# total_vram_gb / gpu_utilization are reference values for the KV pool
# sanity check only. vLLM budgets against the CUDA-visible total (31.44
# GiB; nvidia-smi reports 31.8) with ~2.5 GiB reserved for the desktop,
# so the pool check is (total_vram_gb * gpu_utilization - weights_gb)
# / kv_cache_per_token_gb >= max_model_len.
# ---------------------------------------------------------------------------
total_vram_gb: 31.44
gpu_utilization: 0.90

# Where the opencode client reaches the llama-swap proxy. The local
# opencode (running on the model box) uses loopback; the unit listens
# on 0.0.0.0:8000, so other machines on the LAN can use
# http://192.168.0.183:8000/v1 (box addrs: .186 primary, .183
# secondary) or .186 directly.
vllm_base_url: "http://127.0.0.1:8000/v1"

# --- llama-swap install (llama_swap_install role) -----------------------
# Host-gated via `llama_swap_install` in host_vars.
#
# Gentoo hosts: sci-misc/llama-swap from the `stuff` overlay — the ebuild
# builds from source, which is why the installed binary does NOT
# byte-match the GitHub release tarball (it is a portage build, not a
# release download). state:present is a no-op while any version is
# installed; pin a version in llama_swap_pkg to force one (e.g.
# "sci-misc/llama-swap=270").
llama_swap_pkg: "sci-misc/llama-swap"
llama_swap_overlay_name: "stuff"
llama_swap_overlay_repo: "https://github.com/istitov/stuff.git"
llama_swap_overlay_dest: "/var/db/repos/stuff"
# Non-Gentoo fallback only: pinned release tarball, if-missing (the stat
# guard never overwrites an existing binary). sha256 of the official
# linux_amd64 tarball, per the release's llama-swap_265_checksums.txt.
llama_swap_version: "265"
llama_swap_release_sha256: "cb1f9a94be05afa129d3c17868f1dd2ca710b919333c7b868239dc31575dcfa1"

# subuid/subgid range for system_base's usermod (collision risk on
# multi-user hosts; override in host_vars).
subuid_range: "100000-165535"

opencode_default_model: "vllm/qwen3.8-27b-text"

opencode_instructions:
  - "~/.config/opencode/tool-use-rules.md"

# Active opencode plugins (the billion-context plugin is retired; its
# config block no longer needs the VRAM arithmetic).
opencode_plugins:
  - "@cortexkit/opencode-magic-context@latest"
  - "opencode-cache-hit@latest"

# Remote vLLM endpoints for the opencode config: each entry renders a
# SECOND provider block (the local "vllm" provider is rendered from the
# model list, never from here). Keys must be unique and never "vllm" —
# asserted by the opencode role. When a new model box joins, add its
# entry here (its windows from ITS llama_swap_models/max_model_len).
vllm_endpoints: []
#  - provider: "vllm-b"
#    name: "machine B (llama-swap / vLLM)"
#    base_url: "http://192.168.0.x:8000/v1"
#    models:
#      "some-model-id":
#        context: 262144        # == that endpoint's --max-model-len
#        output: 16384
#        name: "Some Model"
#        # capabilities: { "reasoning": true }
#        # variants:
#        #   - { id: "low", body: { "reasoningEffort": "low" } }

# Standard podman flags for GPU models (everything between
# "podman run --rm --init" and the image line, excluding the per-model
# --name flag). A model that needs a different set -- extra --env flags,
# the CPU model's own mounts/env -- defines its own podman_flags.
# Paths are absolute: llama-swap does not expand $HOME.
# Cache base for the container volume mounts: absolute per host —
# llama-swap does not expand $HOME. host_vars may point it elsewhere.
podman_cache_base: "{{ ansible_user_dir }}/.cache"

gpu_podman_flags:
  - "--device nvidia.com/gpu=all"
  - "--group-add keep-groups"
  - "--ipc=host"
  - "-p 127.0.0.1:${PORT}:8000"
  - "-v {{ podman_cache_base }}/huggingface:/root/.cache/huggingface:z"
  - "-v {{ podman_cache_base }}/vllm:/root/.cache/vllm:z"
  - "-v {{ podman_cache_base }}/vllm-parsers:/parsers:z"

# llama-swap routing groups: GPU models swap exclusively (one loaded at
# a time); the CPU model is permanently resident.
llama_swap_routing:
  - name: gpu
    comment: "GPU models: only one loaded at a time"
    swap: true
    exclusive: true
    members:
      - "qwen3.6-35b-a3b-text"
      - "qwen3.8-27b-text"
  - name: cpu
    comment: "CPU model: permanently resident"
    swap: false
    exclusive: false
    persistent: true
    members:
      - "qwen3.5-4b-cpu"

target_models:
  # limit_output: max tokens requested in a single model response. With
  # the current opencode schema it is independent of limit.context.
  # ---------------------------------------------------------------------------
  # GLM-4.7-Flash -- daily driver. 31.2B total / ~3B active, MLA
  # attention, 202K native context. KV offloading (20 GB CPU) lets the
  # 98304 window exceed the in-GPU pool.
  #
  # clear_thinking:false is the default on purpose: both settings were
  # measured and compaction frequency was the same either way, while
  # clear_thinking's cost is real -- the model stops seeing its own prior
  # reasoning, where it records which approaches it already tried and
  # rejected. Flip to true only if you catch it anchoring on a stale
  # plan. enable_thinking is a separate switch and is unaffected.
  # ---------------------------------------------------------------------------
  - id: "glm-4.7-flash"
    name: "GLM-4.7-Flash (NVFP4)"
    # vLLM v0.32.0 rejects this checkpoint's WNA16 layout; the patched
    # image skips the GPTQ validation in moe_wna16.py (see Containerfile).
    vllm_image: "localhost/vllm-openai:0.32.0-nvfp4-fix"
    max_model_len: 98304
    weights_gb: 17.5
    kv_cache_per_token_gb: 0.00017241
    limit_output: 16384
    container_name: "vllm-glm-flash"
    vllm_args:
      - "--kv-offloading-size 20"
      - "--kv-offloading-backend native"
      - "--model GadflyII/GLM-4.7-Flash-NVFP4"
      - "--served-model-name glm-4.7-flash"
      - "--tensor-parallel-size 1"
      - "--gpu-memory-utilization 0.80"
      - "--max-num-seqs 2"
      - "--max-num-batched-tokens 2048"
      - "--tool-call-parser glm47"
      - "--reasoning-parser glm47"
      - "--enable-auto-tool-choice"
      - "--default-chat-template-kwargs '{\"enable_thinking\":true,\"clear_thinking\":false}'"
      - "--override-generation-config '{\"temperature\":0.7,\"top_p\":1.0,\"repetition_penalty\":1.0}'"
    cmdStop: "podman stop -t 30 --ignore vllm-glm-flash"
    proxy: "http://127.0.0.1:${PORT}"
    checkEndpoint: "/health"
    ttl: 1800
    opencode_enabled: true

  # ---------------------------------------------------------------------------
  # Qwen3-Coder-30B-A3B -- the non-thinking control. 30.5B total / 3.3B
  # active, GQA 32 Q heads / 4 KV heads over 48 layers, 262K native.
  # Emits no reasoning blocks, so it is the clean measurement of what
  # thinking tokens cost; deliberately has no --reasoning-parser.
  #
  # Sampling is Qwen's published recommendation: top_p 0.8, top_k 20,
  # non-zero repetition_penalty (GLM explicitly wants that off). It does
  # not inherit GLM's settings.
  # ---------------------------------------------------------------------------
  - id: "qwen3-coder"
    name: "Qwen3-Coder-30B-A3B (AWQ, non-thinking)"
    vllm_image: "docker.io/vllm/vllm-openai:v0.32.0"
    max_model_len: 98305
    weights_gb: 17.2
    kv_cache_per_token_gb: 0.00011800
    limit_output: 8192
    container_name: "vllm-qwen3-coder"
    vllm_args:
      - "--model cpatonn/Qwen3-Coder-30B-A3B-Instruct-AWQ"
      - "--served-model-name qwen3-coder"
      - "--tensor-parallel-size 1"
      - "--gpu-memory-utilization 0.90"
      - "--max-num-seqs 2"
      - "--tool-call-parser qwen3_coder"
      - "--enable-auto-tool-choice"
      - "--override-generation-config '{\"temperature\":0.7,\"top_p\":0.8,\"top_k\":20,\"repetition_penalty\":1.05}'"
    cmdStop: "podman stop -t 30 --ignore vllm-qwen3-coder"
    proxy: "http://127.0.0.1:${PORT}"
    checkEndpoint: "/health"
    ttl: 1800
    opencode_enabled: true

  # ---------------------------------------------------------------------------
  # Nemotron 3 Nano 30B-A3B -- the interesting one for the KV problem.
  # Hybrid Mamba-2/Transformer: 23 Mamba-2 + MoE layers, only 6 attention
  # layers, so most of the network carries fixed-size recurrent state
  # that does not grow with sequence length. 1M native context.
  #
  # NVFP4 is the only variant that fits: BF16 is ~60GB and FP8 ~30GB
  # leaves no room for cache. vLLM detects it as modelopt_fp4, so no
  # --quantization flag.
  #
  # PREREQUISITE -- the reasoning parser ships as a loose file:
  #   mkdir -p ~/.cache/vllm-parsers && cd ~/.cache/vllm-parsers
  #   wget https://huggingface.co/nvidia/NVIDIA-Nemotron-3-Nano-30B-A3B-BF16/resolve/main/nano_v3_reasoning_parser.py
  # Without it vLLM exits at startup. Use nano_v3, not a DeepSeek parser.
  #
  # Reasoning is switched off per-request with {"enable_thinking": false}
  # rather than a server flag, so there is no --default-chat-template-
  # kwargs here. The model also honours a thinking-token budget.
  # ---------------------------------------------------------------------------
  - id: "nemotron-nano-3"
    name: "Nemotron 3 Nano 30B-A3B (NVFP4, Mamba hybrid)"
    vllm_image: "docker.io/vllm/vllm-openai:v0.32.0"
    max_model_len: 131081
    weights_gb: 17.0
    kv_cache_per_token_gb: 0.00009002
    limit_output: 8192
    container_name: "vllm-nemotron"
    vllm_args:
      - "--model nvidia/NVIDIA-Nemotron-3-Nano-30B-A3B-NVFP4"
      - "--served-model-name nemotron-nano-3"
      - "--trust-remote-code"
      - "--tensor-parallel-size 1"
      - "--gpu-memory-utilization 0.90"
      - "--max-num-seqs 2"
      - "--tool-call-parser qwen3_coder"
      - "--enable-auto-tool-choice"
      - "--reasoning-parser-plugin /parsers/nano_v3_reasoning_parser.py"
      - "--reasoning-parser nano_v3"
      - "--mamba-ssm-cache-dtype float32"
      - "--async-scheduling"
    cmdStop: "podman stop -t 30 --ignore vllm-nemotron"
    proxy: "http://127.0.0.1:${PORT}"
    checkEndpoint: "/health"
    ttl: 1800
    opencode_enabled: true

  # ---------------------------------------------------------------------------
  # Gemma 4 26B-A4B -- 25.2B total / 3.8B active, 30 layers, 128 experts
  # (8 active + 1 shared), 1024-token sliding window, 256K native,
  # multimodal. Now served as the first-party nvidia NVFP4 build with
  # fp8 KV cache; tool calling via the gemma4 parser. 20 GB of CPU KV
  # offloading carries the 131072 window beyond the in-GPU pool.
  # (The earlier AWQ 4bit entry, id gemma-4-26b-a4b, was replaced by
  # this one; the old name lives on in backups/config.yaml.)
  # ---------------------------------------------------------------------------
  - id: "gemma-4-26b"
    name: "Gemma 4 26B (NVFP4)"
    vllm_image: "docker.io/vllm/vllm-openai:v0.32.0"
    max_model_len: 131072
    limit_output: 16384
    container_name: "vllm-gemma4"
    vllm_args:
      - "--model nvidia/Gemma-4-26B-A4B-NVFP4"
      - "--served-model-name gemma-4-26b"
      - "--tensor-parallel-size 1"
      - "--gpu-memory-utilization 0.90"
      - "--kv-cache-dtype fp8"
      - "--max-num-seqs 1"
      - "--max-num-batched-tokens 4096"
      - "--kv-offloading-size 20"
      - "--kv-offloading-backend native"
      - "--reasoning-parser gemma4"
      - "--enable-auto-tool-choice"
      - "--tool-call-parser gemma4"
      - "--default-chat-template-kwargs '{\"enable_thinking\":true}'"
    cmdStop: "podman stop -t 30 --ignore vllm-gemma4"
    proxy: "http://127.0.0.1:${PORT}"
    checkEndpoint: "/health"
    ttl: 1800
    opencode_enabled: true

  # ---------------------------------------------------------------------------
  # Qwen3.6 35B-A3B (NVFP4), text-only. GDN hybrid: linear-attention
  # layers, so its KV pool is small relative to its 262144 window.
  # Reference model for the context budgeting. The pool sanity check is
  # pending: capture "Available KV cache memory" / "GPU KV cache size"
  # from its container logs on next boot.
  # ---------------------------------------------------------------------------
  - id: "qwen3.6-35b-a3b-text"
    name: "Qwen3.6 35B-A3B (NVFP4) No Vision Encoder"
    vllm_image: "localhost/vllm-openai:0.32.0-nvfp4-fix"
    max_model_len: 262144
    weights_gb: 22.0
    # pending the startup log lines (see comment above)
    kv_cache_per_token_gb: 0.0
    limit_output: 16384
    container_name: "vllm-qwen36-35b-a3b-text"
    podman_flags:
      - "--device nvidia.com/gpu=all"
      - "--group-add keep-groups"
      - "--ipc=host"
      - "--env VLLM_HAS_FLASHINFER_CUBIN=1"
      - "-p 127.0.0.1:${PORT}:8000"
      - "-v {{ podman_cache_base }}/huggingface:/root/.cache/huggingface:z"
      - "-v {{ podman_cache_base }}/vllm:/root/.cache/vllm:z"
      - "-v {{ podman_cache_base }}/vllm-parsers:/parsers:z"
    vllm_args:
      - "--model nvidia/Qwen3.6-35B-A3B-NVFP4"
      - "--served-model-name qwen3.6-35b-a3b-text"
      - "--tensor-parallel-size 1"
      - "--trust-remote-code"
      - "--quantization modelopt_fp4"
      - "--gpu-memory-utilization 0.90"
      - "--max-num-seqs 1"
      - "--kv-cache-dtype fp8"
      - "--block-size 128"
      - "--moe-backend marlin"
      - "--attention-backend flashinfer"
      - "--attention-config '{\"use_trtllm_attention\":true}'"
      - "--max-num-batched-tokens 4096"
      - "--enable-chunked-prefill"
      - "--async-scheduling"
      - "--language-model-only"
      - "--skip-mm-profiling"
      - "--reasoning-parser qwen3"
      - "--enable-auto-tool-choice"
      - "--tool-call-parser qwen3_coder"
      - "--default-chat-template-kwargs '{\"enable_thinking\":true,\"preserve_thinking\":true}'"
    cmdStop: "podman stop -t 30 --ignore vllm-qwen36-35b-a3b-text"
    proxy: "http://127.0.0.1:${PORT}"
    checkEndpoint: "/health"
    ttl: 1800
    opencode_enabled: true

  # ---------------------------------------------------------------------------
  # Qwen3.8 27B (NVFP4 RTX 5090 build), text-only. GDN hybrid; the
  # current daily driver (serving this conversation).
  #
  # Calibrated 2026-11-08 from the vLLM startup log (v0.32.0): CUDA-
  # visible total 31.44 GiB, free at startup 28.89, weights + non-torch
  # 17.44 GiB, peak activation 2.21, KV pool 8.66 GiB = 271,183 tokens
  # >= 262,144 (1.03x headroom). Reasoning effort defaults to xhigh via
  # the chat template kwargs; the opencode variants below pin it.
  # ---------------------------------------------------------------------------
  - id: "qwen3.8-27b-text"
    name: "Qwen3.8 27B (NVFP4 RTX 5090) Text"
    opencode_name: "Qwen3.8 27B (NVFP4) No Vision Encoder"
    vllm_image: "localhost/vllm-openai:0.32.0-nvfp4-fix"
    max_model_len: 262144
    weights_gb: 17.4
    kv_cache_per_token_gb: 0.0000319
    limit_output: 32768
    container_name: "vllm-qwen38-27b-text"
    podman_flags:
      - "--device nvidia.com/gpu=all"
      - "--group-add keep-groups"
      - "--ipc=host"
      - "--env VLLM_HAS_FLASHINFER_CUBIN=1"
      - "-p 127.0.0.1:${PORT}:8000"
      - "-v {{ podman_cache_base }}/huggingface:/root/.cache/huggingface:z"
      - "-v {{ podman_cache_base }}/vllm:/root/.cache/vllm:z"
      - "-v {{ podman_cache_base }}/vllm-parsers:/parsers:z"
    vllm_args:
      - "--model gittensor-model-hub/Qwen3.8-27B-NVFP4-RTX5090"
      - "--served-model-name qwen3.8-27b-text"
      - "--tensor-parallel-size 1"
      - "--trust-remote-code"
      - "--quantization modelopt"
      - "--gpu-memory-utilization 0.90"
      - "--max-num-seqs 1"
      - "--kv-cache-dtype fp8"
      - "--max-num-batched-tokens 4096"
      - "--reasoning-parser qwen3"
      - "--enable-auto-tool-choice"
      - "--tool-call-parser qwen3_xml"
      - "--default-chat-template-kwargs '{\"enable_thinking\":true,\"preserve_thinking\":true,\"reasoning_effort\":\"xhigh\"}'"
    opencode_variants:
      - id: low
        body:
          reasoningEffort: low
      - id: medium
        body:
          reasoningEffort: medium
      - id: xhigh
        body:
          reasoningEffort: xhigh
    cmdStop: "podman stop -t 30 --ignore vllm-qwen38-27b-text"
    proxy: "http://127.0.0.1:${PORT}"
    checkEndpoint: "/health"
    ttl: 1800
    opencode_enabled: true

  # ---------------------------------------------------------------------------
  # Gemma 4 31B (RedHatAI NVFP4). The -text variant drops the vision
  # encoder with --language-model-only and widens the window; the full
  # variant keeps it and caps the window at 65536.
  # ---------------------------------------------------------------------------
  - id: "gemma-4-31b-text"
    name: "Gemma 4 31B (NVFP4) No Vision encoder"
    opencode_name: "Gemma 4 31B (NVFP4) No Vision Encoder"
    vllm_image: "localhost/vllm-openai:0.32.0-nvfp4-fix"
    max_model_len: 150800
    limit_output: 16384
    container_name: "vllm-gemma4-31b-text"
    vllm_args:
      - "--model RedHatAI/gemma-4-31B-it-NVFP4"
      - "--served-model-name gemma-4-31b-text"
      - "--tensor-parallel-size 1"
      - "--gpu-memory-utilization 0.91"
      - "--max-num-seqs 1"
      - "--kv-cache-dtype fp8"
      - "--max-num-batched-tokens 640"
      - "--reasoning-parser gemma4"
      - "--enable-auto-tool-choice"
      - "--tool-call-parser gemma4"
      - "--language-model-only"
      - "--default-chat-template-kwargs '{\"enable_thinking\":true}'"
    cmdStop: "podman stop -t 30 --ignore vllm-gemma4-31b-text"
    proxy: "http://127.0.0.1:${PORT}"
    checkEndpoint: "/health"
    ttl: 1800
    opencode_enabled: true

  - id: "gemma-4-31b"
    name: "Gemma 4 31B (NVFP4)"
    vllm_image: "localhost/vllm-openai:0.32.0-nvfp4-fix"
    max_model_len: 65536
    limit_output: 16384
    container_name: "vllm-gemma4-31b"
    vllm_args:
      - "--model RedHatAI/gemma-4-31B-it-NVFP4"
      - "--served-model-name gemma-4-31b"
      - "--tensor-parallel-size 1"
      - "--gpu-memory-utilization 0.90"
      - "--max-num-seqs 1"
      - "--kv-cache-dtype fp8"
      - "--max-num-batched-tokens 4096"
      - "--reasoning-parser gemma4"
      - "--enable-auto-tool-choice"
      - "--tool-call-parser gemma4"
      - "--default-chat-template-kwargs '{\"enable_thinking\":true}'"
    cmdStop: "podman stop -t 30 --ignore vllm-gemma4-31b"
    proxy: "http://127.0.0.1:${PORT}"
    checkEndpoint: "/health"
    ttl: 1800
    opencode_enabled: true

  # ---------------------------------------------------------------------------
  # Qwen3.5 4B (CPU) -- the "historian" for Magic Context: a small,
  # permanently-resident model on the CPU cores that summarises session
  # history while the GPU model handles the live work. See the README
  # "Running the historian on CPU" section. ttl: 0 = never unloaded.
  # VLLM_CPU_OMP_THREADS_BIND=0-7 pins the runtime to cores 0-7.
  # ---------------------------------------------------------------------------
  - id: "qwen3.5-4b-cpu"
    name: "Qwen3.5 4B (CPU)"
    vllm_image: "docker.io/vllm/vllm-openai-cpu:latest-x86_64"
    max_model_len: 65536
    limit_output: 16384
    container_name: "vllm-cpu-historian"
    podman_flags:
      - "-p 127.0.0.1:${PORT}:8000"
      - "--shm-size=1g"
      - "-v {{ podman_cache_base }}/huggingface:/root/.cache/huggingface:z"
      - "-v {{ podman_cache_base }}/vllm-cpu:/root/.cache/vllm:z"
      - "-v {{ podman_cache_base }}/torchinductor-cpu:/tmp/torchinductor_root:z"
      - "-e TORCHINDUCTOR_CACHE_DIR=/tmp/torchinductor_root"
      - "-e VLLM_TARGET_DEVICE=cpu"
      - "-e VLLM_CPU_KVCACHE_SPACE=8"
      - "-e VLLM_CPU_OMP_THREADS_BIND=0-7"
    # vLLM 0.33.0's `vllm serve` CLI (the vllm-openai-cpu image)
    # rejects a model positional unless it is the FIRST argument
    # ("model should be provided as the first positional argument") and
    # deprecates the --model flag ("will be removed in a future
    # version"). So the model is emitted ahead of every option via
    # positional_model, which the template places before --max-model-len.
    positional_model: "Qwen/Qwen3.5-4B"
    vllm_args:
      - "--served-model-name qwen3.5-4b-cpu"
      - "--dtype bfloat16"
      - "--language-model-only"
      - "--reasoning-parser qwen3"
      - "--default-chat-template-kwargs '{\"enable_thinking\": false}'"
    opencode_capabilities:
      tools: true
      input:
        - text
      output:
        - text
    cmdStop: "podman stop -t 30 --ignore vllm-cpu-historian"
    proxy: "http://127.0.0.1:${PORT}"
    checkEndpoint: "/health"
    ttl: 0
    opencode_enabled: true

  # ---------------------------------------------------------------------------
  # EmbeddingGemma 2 -- the "Librarian": RAG / semantic search /
  # long-term memory embeddings. DISABLED 2026-11-08: no longer in use,
  # and the live llama-swap config does not serve it, so opencode must
  # not advertise it. Re-enable both flags if embeddings are needed.
  # ---------------------------------------------------------------------------
  - id: "embedding-gemma-2"
    name: "EmbeddingGemma 2 (Text Only)"
    vllm_image: "docker.io/vllm/vllm-openai:v0.32.0"
    max_model_len: 2048
    limit_output: 1024
    container_name: "vllm-embedding-gemma"
    vllm_args:
      - "--model google/embeddinggemma-2"
      - "--served-model-name embedding-gemma-2"
      - "--tensor-parallel-size 1"
      - "--gpu-memory-utilization 0.20"
    cmdStop: "podman stop -t 30 --ignore vllm-embedding-gemma"
    proxy: "http://127.0.0.1:${PORT}"
    checkEndpoint: "/health"
    ttl: 1800
    opencode_enabled: false
    llama_swap_enabled: false

---
# Contract for a new vLLM model box. Copy to host_vars/<host>.yaml.
#
# host_vars SHADOWS group_vars/all.yaml: set only keys that genuinely
# differ from the shared defaults.
#
# Pre-work on the new host (before the first --check --diff):
#   (a) SSH key from the control box to <user>@<host>
#   (b) sudo for the become tasks (emerge, /usr/bin write, subuid) —
#       key-based; never put a password in this repo
#   (c) caches auto-create on first container run; model weights download
#       lazily (multi-GB) or rsync from an existing box
#
# Keys (deployment gates; defaults keep the shared box working):
#total_vram_gb: 24.0        # KV-pool sanity check only; override per host
#llama_swap_models: []      # this host's model definitions (args/images are
#                           # GPU-specific); omit to inherit target_models
#opencode_managed: false    # true only on the box that runs the opencode
#                           # client (localhost); default false
#nvidia_cdi_managed: false  # false on AMD/Strix Halo boxes (no nvidia-ctk);
#                           # default true
#llama_swap_install: false  # true: install llama-swap (portage sci-misc/
#                           # llama-swap via the stuff overlay on Gentoo,
#                           # pinned release tarball elsewhere); default false
#stuff_overlay_managed: false
#                           # true: keep the 'stuff' overlay registered +
#                           # synced (portage_overlay installs the shared
#                           # tooling git + eslect-repository;
#                           # stuff_overlay does the eselect register/sync).
#                           # Prerequisite of llama_swap_install on Gentoo.
#llama_swap_deploy: false   # true: deploy config + service unit + start the
#                           # llama-swap service; default false until the
#                           # install step has run on that host
#system_base_managed: true  # run system_base tasks (podman + nvidia-container-
#                           # toolkit emerge, subuid/subgid range)
#amd_gtt_limit_pages: 0     # Strix Halo only: iGPU GTT/TTM pool limit in 4K
#                           # pages (target GiB * 1024**3 / 4096); rendered
#                           # to /etc/modprobe.d/ttm.conf by the amd_gtt role
#                           # (AMD official: BIOS UMA carve-out to its minimum,
#                           # raise GTT instead). Omit on NVIDIA boxes.
#amd_gtt_managed: false      # root run renders ttm.conf for this host
#amd_gtt_grub_managed: false # root run owns the GRUB input side: the
#                           # GRUB_CMDLINE_LINUX ttm options in
#                           # /etc/default/grub (the distro's grub-mkconfig
#                           # sources that file, NOT make.conf), plus a
#                           # report-only check that the generated
#                           # /boot/grub/grub.cfg still carries the options
#podman_cache_base: "{{ ansible_user_dir }}/.cache"
#                         # override only if caches live elsewhere
#gpu_podman_flags: []       # override only if this host's podman/udev differs
#                           # from the shared flags (the shared set assumes
#                           # Gentoo udev keep-groups + crun)
#
# Also add this host's remote-provider catalog entry to vllm_endpoints in
# group_vars/all.yaml (provider key + base_url + its model windows) so the
# opencode box can reach it.

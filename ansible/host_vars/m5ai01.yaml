---
# m5ai01 — Strix Halo (Ryzen AI MAX+ 395 / Radeon 8060S, gfx1151),
# 128 GB unified memory, Gentoo. In the `vllm` inventory group.
#
# Deployment user: dedicated `prod` account (uid 1000, key-only, wheel
# + NOPASSWD sudo) — rootless podman + user-unit llama-swap. root.key
# stays out-of-band. Device access: /dev/kfd + /dev/dri/renderD* are
# world-accessible; /dev/dri/card0 needs the video group (prod is in
# video+render).
#
# Known host quirk (2026-11-08): the resolver (systemd-resolved)
# cannot resolve distfiles.gentoo.org (other public domains work),
# which blocks every emerge that downloads distfiles. Workaround in
# place: a /etc/hosts entry (138.199.17.162, added by hand). A proper
# resolver/DNSSEC fix is better; the hosts line can then be dropped.

# iGPU GTT/TTM pool limit, managed by the amd_gtt role
# (/etc/modprobe.d/ttm.conf). 4 KiB pages: 30720000 = 120000M = ~117.2 GiB.
# Bumped 2026-11-11 from 28835840 (110 GiB) to 30720000 for the GLM-5.3
# engine, whose startup admission wants ~117 GiB GPU-mappable — the
# engine lab's own pin. BIOS UMA carve-out is at its 1G minimum, so the
# OS keeps ~7 GiB and the iGPU can address ~117 GiB of the unified pool.
# See the README "Strix Halo (AMD Strix Halo boxes): GFX UMA" section.
amd_gtt_limit_pages: 30720000

# Privilege model (user decision, 2026-11-08): prod gets NO sudo.
# Routine playbook runs connect as prod and touch only user-scoped state
# (llama-swap config/unit/service + podman) — zero become tasks. All
# root-side roles are gated OFF below; root-level maintenance (package
# installs, GTT limit changes, overlay sync) is done out-of-band via
# root.key, or by running this playbook with a root connection:
#   ansible-playbook -i ansible/inventory.yaml ansible/playbook.yaml \
#     -l m5ai01 -e ansible_user=root \
#     -e ansible_private_key_file=/home/martin/.ssh/keys/root.key \
#     -e system_base_managed=true -e stuff_overlay_managed=true
#
# Deployment gates: all bootstrap steps done (podman + llama-swap 270
# installed, 2026-11-08); the box now serves models.
nvidia_cdi_managed: false
system_base_packages:
  - app-containers/podman
  - app-admin/sudo
  # sys-apps/shadow provides the newuidmap/newgidmap helpers rootless
  # podman escalates through; sys-libs/libcap provides setcap/getcap
  # (the system_base file-caps task re-applies the helper caps after
  # any shadow package update strips them).
  - sys-apps/shadow
  - sys-libs/libcap
  # git + eslect-repository arrive with the portage_overlay role
  # (the llama-swap install path), not with the base system

# Rootless podman on this distro kernel writes a multi-extent uid_map
# (self-uid + both subuid ranges); two ranges are the live state.
subuid_ranges:
  - "100000-165535"
  - "165536-231071"

# Root-side roles: off for the routine prod run; flip (temporarily) for
# a root-connection maintenance run, see the block above.
system_base_managed: false
stuff_overlay_managed: false
llama_swap_install: false
amd_gtt_managed: true     # root run owns /etc/modprobe.d/ttm.conf (2026-11-10
                           # cutover: rendered with the role's comment header)
amd_gtt_grub_managed: true # root run owns the GRUB input side
                           # (/etc/default/grub GRUB_CMDLINE_LINUX ttm options;
                           # the generated /boot/grub/grub.cfg stays
                           # unmanaged, verified by the role's report task)

opencode_managed: false     # no opencode on m5ai01; the desktop's opencode
                            # reaches it via the vllm-m5 entry in group_vars
# Rootless-podman memlock pin for the llama-swap user service (see the
# unit template comment: userns-root containers inherit hard rlimits
# from the spawning service and can never raise them). Pairs with the
# system_base DefaultLimitMEMLOCK system.conf task.
llama_swap_memlock_infinity: true
llama_swap_deploy: true     # the routine work: config + service unit + start
llama_swap_autostart: true  # [Install] + enabled: the service comes up at
                            # boot via default.target (linger already in place
                            # from the bootstrap step; Linger=yes confirmed)
llama_swap_linger: false    # linger was enabled once (root, bootstrap);
                            # the systemd state persists, no re-run needed

# ----------------------------------------------------------------------------
# The m5ai01 model catalog (this host's iGPU pool: ~105 GiB at util 0.95).
# Single-model deployment (2026-11-09, user decision): the 3.8-gen
# flagship via gufo only. The vLLM/Quark-MXFP4 route for this model OOMs
# this board (51B PLE table ~102 GB bf16 > the ~105 GiB pool; PLE->NVMe
# offload exists only in tcclaviger's dual-R9700 patched image).
# Further vLLM models (e.g. a 3B-active workhorse) can be added back as
# separate entries — the desktop's shared gpu_podman_flags in
# group_vars/all.yaml documents the AMD podman flag set (rootless
# kfd/dri + ROCm env) they need.
#
# The gufo entry carries its own podman_flags (its image is bare:
# Entrypoint+Cmd null, binary at /bin/gufo), so no host-level
# gpu_podman_flags override is needed on this host.

llama_swap_models:
  # THE FLAGSHIP via gufo (2026-11-09): Qwen3.8-Flash-Next, newest
  #    3.8-gen MoE (6B active; beats Qwen3.8-27B on SWE-Pro 62.5 vs 61.7
  #    and DeepSWE 58.7 vs 42.2). The vLLM/Quark-MXFP4 route for this
  #    model OOMs this board at the PLE table (see the catalog header);
  #    this one runs the Unsloth UD-Q4_K_XL GGUF
  #    (111.3 GB, 4 shards, SHA-256 verified at fetch time) under gufo,
  #    the Strix-Halo-dedicated engine: mmaps the shards, pages the PLE
  #    table on demand, MTP speculative decoding (~28 tok/s AR, up to
  #    ~117 tok/s MTP measured on this machine class). OpenAI-compatible
  #    server -> the llama-swap proxy path is unchanged.
  #    Usage accounting is BAKED IN (no vLLM-style opt-in flag): every
  #    response carries usage.prompt_tokens_details.cached_tokens plus a
  #    gufo-specific usage.gufo extension (cache ledger, MTP draft
  #    acceptance, TTFT, tok/s). serve llm's Cache flags
  #    (--cache-ram-bytes/--cache-disk*) tune the prefix cache, they do
  #    not gate the usage fields.
  - id: qwen3.8-flash-gguf
    name: Qwen3.8-Flash-Next (UD-Q4_K_XL, gufo)
    vllm_image: ghcr.io/gufo-org/toolboxes/gufo-runtime:latest
    vllm: false   # non-vLLM engine: template skips the vLLM-only args
    positional_model: >-
      serve --host 0.0.0.0 --port 8000 --sessions 1 llm
      --model /models/UD-Q4_K_XL/Qwen3.8-Flash-Next-UD-Q4_K_XL-00001-of-00004.gguf
      --context 133760 --max-tokens 8192
      --served-model-name qwen3.8-flash-gguf
      --speculative mtp
      --mtp-model /models/MTP/mtp-Qwen3.8-Flash-Next-shared-Q8_0.gguf
    max_model_len: 133760
    limit_output: 8192
    container_name: gufo-qwen3.8-flash-gguf
    # The gufo image is BARE (Entrypoint + Cmd both null — like kyuz0's
    # toolbox image): without an explicit entrypoint the post-image args
    # are exec'd as the command and pid1 dies (ENOENT on "serve"). /bin/gufo
    # is the engine binary; /models is a read-only BIND mount of prod's home
    # (gufo only reads; the named-volume trick in the shared flags is for
    # container writes). --ipc=host per the gufo docs; no torch env vars.
    podman_flags:
      - "--entrypoint /bin/gufo"
      - "--device /dev/kfd"
      - "--device /dev/dri"
      - "--group-add keep-groups"
      - "--security-opt seccomp=unconfined"
      - "--ipc=host"
      - "--ulimit memlock=-1"
      - "-p 127.0.0.1:${PORT}:8000"
      - "-v /home/prod/models/flash-next:/models:ro"
      - "-e HSA_OVERRIDE_GFX_VERSION=11.5.1"
    vllm_args: []
    cmdStop: podman stop -t 30 --ignore gufo-qwen3.8-flash-gguf
    proxy: http://127.0.0.1:${PORT}
    checkEndpoint: /v1/models
    ttl: 1800
    opencode_enabled: false

  # THE POOLED FLAGSHIP (2026-11-10): the same model as above, but
  #    2-rank tensor-parallel over the USB4 RDMA rails — rank0 on
  #    this box + rank1 on m5ai02 (single TB3 cable, ~14.4 Gbit/s
  #    effective; measured prefill ~149-161 tok/s, decode ~44.5-51.6
  #    tok/s single-user with MTP, 512K context x 2 sessions).
  #    Script model: cmd/cmdStop call the gufo_tp2 wrapper, which
  #    starts rank1 over prod-SSH and runs rank0 in the foreground on
  #    ${PORT} so llama-swap's load/stop semantics stay clean.
  #    container_name drives the service's ExecStopPost stop list.
  #    The launcher script, image and model sync ship with the
  #    gufo_tp2 role (gate gufo_tp2_managed; cutover ordering in
  #    docs/tp2-pooling.md).
  - id: gufo-qwen3.8-flash-next-tp2-q4
    name: "Qwen3.8-Flash-Next TP2 (UD-Q4_K_XL, 2x Strix Halo)"
    vllm: false
    cmd_override: /home/prod/tp2-swap.sh run ${PORT} q4
    cmdStop: /home/prod/tp2-swap.sh stop
    proxy: http://127.0.0.1:${PORT}
    checkEndpoint: /v1/models
    ttl: 1800
    container_name: gufo-tp2-rank0
    opencode_enabled: false

# Routing override: m5ai01 has no CPU historian — one exclusive GPU group.
llama_swap_routing:
  - name: gpu
    comment: "GPU models: one loaded at a time (iGPU pool)"
    swap: true
    exclusive: true
    members:
      # Only enabled models may appear here (llama-swap refuses to start
      # when a member has no model config; the template guard enforces
      # it at deploy time).
      - "qwen3.8-flash-gguf"
      - "gufo-qwen3.8-flash-next-tp2-q4"

# Two-box pooling (gufo_tp2 role, 2026-11-10): this box is the rank0
# host (serves HTTP + runs the llama-swap wrapper + the prod-SSH hop).
# The USB4 RDMA persistence (usb4_rdma role) is the launch
# prerequisite, not the file deployment. The image digest pins the
# 2026-11-10 build (rootful on this box + prod stores on both boxes).
gufo_tp2_managed: true
gufo_tp2_rank: rank0
gufo_tp2_image_digest: "3b1cd967de06e82a2867811b570aad1cd57fa8a3a208e5c949cad64b645b6d28"

# USB4 RDMA persistence (usb4_rdma role, root-gated): this host's
# side of the TB3 cable. tbv0 carries the RoCE address
# (192.168.240.1/24, unroutable between the boxes on purpose).
usb4_rdma_tbv0_ip: "192.168.240.1/24"
usb4_rdma_tbv0_uuid: "b59bc161-1bda-46c4-823e-f6091f9a9991"

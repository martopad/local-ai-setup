---
# Deploy llama-swap (+ opencode client config) on the vllm model boxes
# Inventory: ansible/inventory.yaml (group vllm; one entry per model box,
# host-specific keys in ansible/host_vars/<host>.yaml)
- name: Deploy llama-swap on vllm model boxes
  hosts: vllm
  roles:
    - system_base
    - nvidia_cdi
    - amd_gtt
    # Two-box pooling (m5ai01 rank0 + m5ai02 rank1 over USB4 RDMA).
    # Order contract: this role's scripts land BEFORE llama_swap, so
    # the rendered cmd_override entry never points at a missing script
    # (the config entry itself is gated on gufo_tp2_managed in the
    # host_vars; cutover ordering in docs/tp2-pooling.md). The USB4
    # RDMA persistence (usb4_rdma role) is a prerequisite for LAUNCH,
    # not for the role's file deployment.
    - gufo_tp2
    # portage_overlay + stuff_overlay are the dependency of
    # llama_swap_install: the first installs the shared overlay tooling
    # (git + eselect-repository), the second registers + syncs the
    # 'stuff' overlay, so the portage task in llama_swap_install can
    # see it. Both gate on stuff_overlay_managed.
    - portage_overlay
    - stuff_overlay
    - llama_swap_install
    - llama_swap
    - role: opencode
      tags: [opencode]

# Root-gated play: the USB4 RDMA persistence layer (DKMS module,
# modprobe params, tbv0 dummy). Root-side artifacts, so this play
# runs as root. Cutover invocation (the gate is CLI, mirroring
# system_base's root-gated tasks; -e gufo_tp2_managed=false keeps
# play 1's prod-owned file deployment OUT of the root run so the
# script ownership doesn't drift to root):
#   ansible-playbook -i ansible/inventory.yaml ansible/playbook.yaml \
#     -l m5ai01,m5ai02 -e ansible_user=root \
#     -e ansible_private_key_file=$HOME/.ssh/keys/root.key \
#     -e usb4_rdma_managed=true -e gufo_tp2_managed=false
# Cutover window: stop the gufo-tp2 pair first; the role's first
# task refuses to run while the containers are live on the touched
# host.
- name: USB4 RDMA persistence (root)
  hosts: vllm
  become: false
  roles:
    - usb4_rdma
